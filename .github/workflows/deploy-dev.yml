name: Deploy to VPS (dev)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          echo "Instalando todas las dependencias para el build"
          npm ci

      - name: Build project
        run: |
          echo "Haciendo build del proyecto"
          npm run build

      - name: Clean up node_modules for production
        run: |
          echo "Instalando solo dependencias de producción"
          npm prune --production

      - name: Create deploy package
        run: |
          echo "Creando paquete de despliegue"
          tar czf deploy.tar.gz dist package.json package-lock.json node_modules

      - name: Add SSH key
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Copy package to VPS
        run: |
          echo "Copiando paquete al VPS..."
          scp -i private_key.pem -o StrictHostKeyChecking=no deploy.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}

      - name: Extract and restart on VPS
        run: |
          echo "Extrayendo paquete y reiniciando PM2 en el VPS..."
          ssh -i private_key.pem -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ${{ secrets.VPS_PATH }}
            echo "Extrayendo paquete"
            tar xzf deploy.tar.gz
            rm deploy.tar.gz

            echo "Reiniciando PM2"
            if pm2 describe mi-backend-dev > /dev/null; then
              pm2 restart mi-backend-dev
            else
              npm run pm2:start
            fi
            echo "Deploy exitoso"
          EOF
