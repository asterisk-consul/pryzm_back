name: Deploy to VPS (dev)

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Prepare production files
        run: npm prune --production

      - name: Add SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Copy files via rsync
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
            dist/ package.json package-lock.json .env node_modules/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}

      - name: Restart PM2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<EOF
            cd ${{ secrets.VPS_PATH }}
            if pm2 describe mi-backend-dev >/dev/null; then
              pm2 restart mi-backend-dev
            else
              npm run pm2:start
            fi
          EOF
