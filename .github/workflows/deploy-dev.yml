name: Deploy to VPS (dev)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          echo "Instalando dependencias para build..."
          npm ci

      - name: Build project
        run: |
          echo "Generando build del proyecto..."
          npm run build

      - name: Clean up node_modules for production
        run: |
          echo "Dejando solo dependencias de producción..."
          npm prune --production

      - name: Prepare deploy package
        run: |
          echo "Preparando paquete limpio de despliegue..."
          mkdir deploy
          mv dist deploy/dist
          mv node_modules deploy/node
          cp package.json deploy/
          cp package-lock.json deploy/

          tar czf deploy.tar.gz -C deploy .

      - name: Add SSH key
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Upload deploy package
        run: |
          echo "Subiendo deploy.tar.gz al VPS..."
          scp -i private_key.pem -o StrictHostKeyChecking=no deploy.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}

      - name: Deploy on VPS
        run: |
          echo "Desplegando en el VPS..."
          ssh -i private_key.pem -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd ${{ secrets.VPS_PATH }}

            echo "Extrayendo nuevo paquete en directorio temporal..."
            mkdir -p temp_deploy
            tar xzf deploy.tar.gz -C temp_deploy

            echo "Reemplazando archivos (excepto .env)..."
            # Mover todos los archivos excepto .env
            find temp_deploy -maxdepth 1 -mindepth 1 ! -name '.env' -exec cp -rf {} . \;

            echo "Limpiando archivos temporales..."
            rm -rf temp_deploy deploy.tar.gz

            echo "Reinstalando dependencias de producción..."
            npm ci --production

            echo "Reiniciando PM2..."
            if pm2 describe mi-backend-dev > /dev/null; then
              pm2 restart mi-backend-dev
            else
              npm run pm2:start
            fi

            echo "Deploy completado correctamente ✅"
          EOF
